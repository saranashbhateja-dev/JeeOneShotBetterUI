/* ===== UI refresh: clearer desktop workspace, calmer surfaces, stronger hierarchy ===== */
:root{--radius:22px;--shadow:0 18px 50px rgba(0,0,0,.14)}
body{background:radial-gradient(ellipse at 0% 0%,color-mix(in srgb,var(--accent) 13%,transparent),transparent 34%),var(--bg);letter-spacing:-.006em}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);grid-template-areas:"header header" "nav main" "foot foot";column-gap:24px;row-gap:0;max-width:1540px;padding:24px 28px 48px}
.topbar{grid-area:header;padding:2px 0 22px;margin-bottom:0;border-bottom:1px solid var(--line)}
.nav{grid-area:nav;display:flex;flex-direction:column;align-self:start;position:sticky;top:20px;overflow:visible;gap:7px;padding:9px;margin:22px 0 0;border-radius:20px;background:color-mix(in srgb,var(--panel) 92%,transparent);box-shadow:0 10px 35px rgba(0,0,0,.08)}
.nav button{flex:0 0 auto;text-align:left;padding:13px 14px;border-radius:12px;font-size:13px;display:flex;align-items:center;gap:10px}
.nav button::before{content:"";display:block;width:7px;height:7px;border-radius:3px;background:currentColor;opacity:.55;flex:none}
.nav button.active{background:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 20%,transparent)}
.nav button.active::before{background:white;opacity:1;box-shadow:0 0 0 4px #ffffff22}
main{grid-area:main;min-width:0;padding-top:22px}
.footnote{grid-area:foot;padding-top:18px;border-top:1px solid var(--line);margin-top:26px}
.hero{padding:clamp(23px,3vw,36px);border-radius:28px;box-shadow:0 20px 55px rgba(0,0,0,.12)}
.hero h1{max-width:720px}
.panel,.stat,.subject-card,.chapter-card{transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.panel{border-radius:21px;box-shadow:0 9px 30px rgba(0,0,0,.045)}
.stat{border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.045)}
.stat-value{letter-spacing:-.055em}
.subject-card{border-radius:19px}
.chapter-card{border-radius:18px;padding:17px}
.chapter-card:hover,.subject-card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--subject-color,var(--accent)) 45%,var(--line));box-shadow:0 14px 30px rgba(0,0,0,.1)}
.btn{border-radius:12px;transition:transform .15s ease,filter .15s ease,box-shadow .15s ease}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.field input,.field select,.field textarea,input.control,select.control{border-radius:12px;min-height:43px;transition:border-color .15s ease,box-shadow .15s ease}
.field input:focus,.field select:focus,.field textarea:focus,input.control:focus,select.control:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.calendar-grid{gap:7px}
.daycell{border-radius:13px;min-height:88px;padding:9px}
.daycell:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel2))}
.schedule-detail{top:22px}
.detail-title{font-size:23px}
.checkrow{border-radius:12px}
.sync-pill{box-shadow:0 5px 16px rgba(0,0,0,.04)}
.toast{backdrop-filter:blur(16px)}
@media(max-width:1100px){
 .app{display:block;max-width:1200px;padding:20px 20px 50px}
 .topbar{padding-bottom:18px}
 .nav{position:sticky;top:8px;z-index:20;flex-direction:row;overflow-x:auto;margin:16px 0 0;gap:5px}
 .nav button{flex:1 0 auto;text-align:center;justify-content:center;padding:11px 14px}
 .nav button::before{display:none}
 main{padding-top:18px}
 .footnote{margin-top:22px}
}
@media(max-width:700px){
 .app{padding:12px 12px 34px}

 .nav button{font-size:12px;padding:10px 12px;border-radius:10px}
 main{padding-top:14px}
 .hero{box-shadow:0 12px 30px rgba(0,0,0,.1)}
 .panel{box-shadow:none}
 .daycell{min-height:63px}
}
@media(prefers-reduced-motion:reduce){.panel,.stat,.subject-card,.chapter-card,.btn{transition:none!important}}

</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="logo">JEE</div><div><div class="brand-title">JEE OneShot OS</div><div class="brand-sub">FOCUSED STUDY TRACKER</div></div></div>
    <div class="topright"><div class="clockbox"><div class="clock" id="clock">--:--:--</div><div class="date-text" id="date-label">Tuesday, 13 October 2026</div></div><div class="sync-pill" id="sync-pill"><span class="sync-dot"></span><span id="sync-label">Saved on this device</span></div></div>
  </header>
  <nav class="nav" aria-label="Main navigation" id="main-nav">
    <button class="active" data-view="dashboard">Overview</button><button data-view="schedule">Schedule</button><button data-view="chapters">Chapters</button><button data-view="settings">Settings &amp; Sync</button>
  </nav>
  <main>
    <section class="view" id="view-dashboard"></section>
    <section class="view" id="view-schedule" hidden></section>
    <section class="view" id="view-chapters" hidden></section>
    <section class="view" id="view-settings" hidden></section>
  </main>
  <div class="footnote">Your chapter labels are the source of truth. Playlist titles are never displayed. Progress is saved locally first; cloud sync is optional.</div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="app.js"></script>
